[package]
name = "opspilot"
version = "0.1.0"
description = "AI-native SSH client for server operations"
authors = ["OpsPilot"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "opspilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
axum = { version = "0.8", features = ["json"] }
regex = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Default: no TLS backend pulled in (native-tls uses Windows Schannel, no C compile).
# On non-Windows you may need to add the appropriate native-tls backend.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
] }
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
parking_lot = "0.12"
which = "7"
keyring = "4"

# Real SSH backend (optional).  Enabled with `--features ssh-real`.
# Requires a C toolchain (MSVC cl.exe / cc) because russh's crypto backend
# (aws-lc-rs) compiles native code.  The default `mock-ssh` build needs no
# C toolchain and ships a pure-Rust simulated terminal so the whole app still
# compiles and runs for development / UI work.
russh = { version = "0.63", optional = true, features = ["async-trait"] }

[features]
default = ["mock-ssh"]
mock-ssh = []
ssh-real = ["dep:russh"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
